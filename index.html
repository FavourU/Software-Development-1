<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>I know, you know, we know – Trivia</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    :root {
      --bg: #2b0b1a;          /* deep burgundy */
      --card: #3b1024;        /* slightly lighter burgundy */
      --accent: #ff6fa8;      /* bright pink */
      --accent-dark: #e05590; /* darker pink for hover */
      --text-main: #ffffff;   /* white text */
      --text-muted: #f7cfe0;  /* soft pink for subtext */
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #5b1635 0, var(--bg) 55%, #15040b 100%);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .container {
      max-width: 700px;
      width: 100%;
      background-color: rgba(43, 11, 26, 0.9);
      border-radius: 1.5rem;
      padding: 2.5rem 2rem;
      box-shadow:
        0 18px 45px rgba(0, 0, 0, 0.6),
        0 0 0 2px rgba(255, 111, 168, 0.25);
      text-align: center;
    }

    .title {
      font-size: 2.2rem;
      margin-bottom: 0.75rem;
      letter-spacing: 0.04em;
    }

    .subtitle {
      font-size: 1.1rem;
      color: var(--accent);
      margin-bottom: 1.5rem;
      font-weight: 600;
    }

    .description {
      font-size: 1rem;
      line-height: 1.6;
      color: var(--text-muted);
      margin-bottom: 2.5rem;
    }

    .cta-button {
      display: inline-block;
      padding: 1rem 2.75rem;
      font-size: 1.1rem;
      font-weight: 700;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      background: linear-gradient(135deg, var(--accent), #ffc1dd);
      color: #2b0b1a;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      box-shadow:
        0 10px 25px rgba(0, 0, 0, 0.5),
        0 0 0 3px rgba(255, 255, 255, 0.08);
      transition:
        transform 0.12s ease-out,
        box-shadow 0.12s ease-out,
        background 0.12s ease-out;
    }

    .cta-button:focus-visible {
      outline: 3px solid #ffffff;
      outline-offset: 3px;
    }

    .cta-button:hover {
      background: linear-gradient(135deg, var(--accent-dark), #ff9fc7);
      transform: translateY(-2px);
      box-shadow:
        0 14px 30px rgba(0, 0, 0, 0.6),
        0 0 0 3px rgba(255, 255, 255, 0.1);
    }

    .cta-button:active {
      transform: translateY(0);
      box-shadow:
        0 8px 18px rgba(0, 0, 0, 0.6),
        0 0 0 3px rgba(255, 255, 255, 0.1);
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    @media (min-width: 768px) {
      .container {
        padding: 3rem 3rem;
      }

      .title {
        font-size: 2.6rem;
      }

      .description {
        font-size: 1.05rem;
      }
    }
  </style>
</head>
<body>
  <main class="container" role="main" aria-labelledby="quiz-title">
    <h1 id="quiz-title" class="title">
      WELCOME TO THE <br>
      <span style="color: var(--accent); font-weight: 800;">
        “I know 👀, YOU know🥺, WE know😏” 
      </span><br><br>
      QUIZ! 🥳🥳🥳
    </h1>
    <p class="subtitle">
      Are you ready to get started?
    </p>
    <p class="description">
      How much do you really know? This quiz will put your knowledge—and maybe your confidence—to the test.
      When you’re ready for a challenge, click the button below and let’s see what you’ve got!
    </p>

    <!-- Replace the onclick with your own navigation logic later -->
    <button class="cta-button" type="button" onclick="alert('You are ready! Start the quiz here.')">
      I am ready!!!
    </button>
  </main>
</body>
</html>
